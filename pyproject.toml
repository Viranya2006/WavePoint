[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.11.0", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "wavepoint"
version = "1.0.0"
description = "Hand gesture mouse control for Windows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "WavePoint Team"}
]
keywords = ["gesture", "mouse", "hand-tracking", "accessibility", "mediapipe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "PyQt6>=6.5.0",
    "pywin32>=306",
    "pynput>=1.7.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pybind11>=2.11.0",
    "cmake>=3.27.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
gpu = [
    "tensorflow>=2.13.0",
]

[project.scripts]
wavepoint = "gesture_mouse.app:main"

[project.urls]
Homepage = "https://github.com/wavepoint/wavepoint"
Documentation = "https://github.com/wavepoint/wavepoint#readme"
Repository = "https://github.com/wavepoint/wavepoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gesture_mouse = ["*.pyd", "*.so", "*.dll"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
